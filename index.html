<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Тестовые задания на знание нормативной документации</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0; --line2:#cbd5e1;
    --txt:#0f172a; --mut:#64748b; --acc:#2563eb; --acc2:#7c3aed;
    --ok:#10b981; --bad:#ef4444; --warn:#f59e0b; --soft:#f8fafc;
    --shadow:0 10px 30px rgba(15,23,42,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    background:radial-gradient(circle at 10% 0%,#dbeafe 0%,transparent 40%),
               radial-gradient(circle at 90% 100%,#e0e7ff 0%,transparent 40%),
               var(--bg);
    color:var(--txt);min-height:100vh;padding:24px 16px 60px;font-size:15px;line-height:1.5;
  }
  .app{max-width:900px;margin:0 auto}

  header.top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .logo{width:48px;height:48px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--acc),var(--acc2));
    display:grid;place-items:center;color:#fff;
    box-shadow:0 8px 22px rgba(37,99,235,.28);overflow:hidden}
  .logo svg{width:30px;height:30px;display:block}
  h1{font-size:19px;font-weight:700;letter-spacing:.2px;line-height:1.3}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:24px;box-shadow:var(--shadow);animation:in .35s ease}
  .card + .card{margin-top:16px}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  h2{font-size:17px;font-weight:700;margin-bottom:10px}
  h3{font-size:14px;font-weight:700;margin:20px 0 10px;color:#334155}
  .muted{color:var(--mut);font-size:13.5px;line-height:1.55}

  .field{margin:16px 0 4px}
  .field label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:7px}
  .field label .req{color:var(--bad)}
  input[type=text]{width:100%;padding:13px 14px;font-size:15px;font-family:inherit;
    background:var(--soft);border:1.5px solid var(--line2);border-radius:12px;
    color:var(--txt);outline:none;transition:.18s}
  input[type=text]:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
  input[type=text].err{border-color:var(--bad);background:#fef2f2}
  .errbox{font-size:12.5px;color:var(--bad);margin-top:6px;min-height:0}

  .topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px;margin:6px 0}
  .topic{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border-radius:14px;
    background:var(--soft);border:1.5px solid var(--line);cursor:pointer;transition:.16s;
    font-size:13.5px;user-select:none;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .topic:hover{border-color:var(--acc);background:#eff6ff}
  .topic.on{background:linear-gradient(135deg,#eff6ff,#f5f3ff);border-color:var(--acc);
    box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .topic input{accent-color:var(--acc);margin-top:4px;flex:0 0 auto;width:16px;height:16px}
  .topic .ticon{font-size:18px;line-height:1.2;flex:0 0 auto;margin-top:1px}
  .topic .tmeta{flex:1;min-width:0}
  .topic .tname{display:block;font-weight:600;color:#1e293b;line-height:1.35}
  .topic .cnt{display:inline-block;margin-top:5px;padding:2px 9px;border-radius:99px;
    background:#e2e8f0;color:#334155;font-size:11.5px;font-weight:700}
  .topic.on .cnt{background:#dbeafe;color:#1d4ed8}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .row.between{justify-content:space-between}
  .row.tight{margin:0;gap:8px}

  .btn{border:0;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:600;
    cursor:pointer;background:#e2e8f0;color:var(--txt);transition:.18s;font-family:inherit;min-height:46px}
  .btn:hover{filter:brightness(.96)}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;
    box-shadow:0 8px 20px rgba(37,99,235,.28)}
  .btn.ghost{background:#fff;border:1.5px solid var(--line2);color:#334155}
  .btn.ghost:hover{background:var(--soft)}
  .btn.warn{background:#fff7ed;border:1.5px solid #fdba74;color:#c2410c}
  .btn.warn.on{background:var(--warn);border-color:var(--warn);color:#fff}
  .btn.small{padding:9px 14px;font-size:13px;min-height:40px}

  .bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:10px 0 16px}
  .bar > i{display:block;height:100%;width:0;border-radius:99px;
    box-shadow:0 0 8px rgba(37,99,235,.35);
    background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s ease}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font-size:11.5px;padding:5px 11px;border-radius:99px;background:var(--soft);
    border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
  .chip.t{color:var(--acc);border-color:#bfdbfe;background:#eff6ff;font-weight:600}
  .chip.commented{color:#c2410c;border-color:#fdba74;background:#fff7ed}

  .qtext{font-size:16.5px;line-height:1.5;font-weight:600;margin:8px 0 6px}
  .qhint{font-size:12.5px;color:var(--mut);margin-bottom:14px}
  .qhint.multi{color:#1d4ed8;font-weight:600;background:#eff6ff;display:inline-block;
    padding:4px 10px;border-radius:99px;border:1px solid #bfdbfe}

  .opt{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border-radius:14px;
    background:#fff;border:1.5px solid var(--line2);cursor:pointer;margin-bottom:9px;
    transition:.16s;font-size:14.5px;line-height:1.45;min-height:52px;
    box-shadow:0 1px 2px rgba(15,23,42,.03)}
  .opt:hover{border-color:#93c5fd;background:#f8fbff}
  .opt .mk{width:26px;height:26px;flex:0 0 auto;border-radius:8px;border:2px solid #cbd5e1;
    display:grid;place-items:center;font-size:12px;font-weight:700;color:#94a3b8;
    transition:.16s;background:#fff}
  .opt.sel{background:linear-gradient(135deg,#eff6ff,#f5f3ff);border-color:#60a5fa;
    box-shadow:0 0 0 3px rgba(37,99,235,.14)}
  .opt.sel .mk{background:var(--acc);border-color:var(--acc);color:#fff}
  .opt.correct{background:#f0fdf4;border-color:var(--ok)}
  .opt.correct .mk{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.wrong{background:#fef2f2;border-color:var(--bad)}
  .opt.wrong .mk{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.locked{cursor:default}
  .opt.locked:hover{border-color:inherit;background:inherit}

  .flagbox{display:none;margin-top:12px;padding:14px;background:#fffbeb;
    border:1.5px solid #fde68a;border-radius:12px;animation:in .2s ease}
  .flagbox.open{display:block}
  .flagbox label{display:block;font-size:12.5px;font-weight:700;color:#92400e;margin-bottom:7px}
  textarea{width:100%;min-height:90px;padding:11px 13px;font-size:14px;font-family:inherit;
    background:#fff;border:1.5px solid #fcd34d;border-radius:10px;color:var(--txt);
    resize:vertical;outline:none}
  textarea:focus{border-color:var(--warn);box-shadow:0 0 0 4px rgba(245,158,11,.15)}

  .moment{margin-top:14px;padding:14px 16px;border-radius:12px;background:#f8fafc;
    border:1.5px solid var(--line);animation:in .3s ease}
  .moment.ok{background:#f0fdf4;border-color:#86efac}
  .moment.no{background:#fef2f2;border-color:#fca5a5}
  .moment-head{font-size:15.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .moment.ok .moment-head{color:#065f46}
  .moment.no .moment-head{color:#991b1b}
  .moment-row{font-size:13.5px;color:#475569;margin:6px 0;line-height:1.55}
  .moment-row > span{color:#64748b}
  .moment-row b{color:#0f172a;font-weight:700}
  .moment-row.bad b{color:#b91c1c}
  .moment-row.warn b{color:#b45309}
  .expl{margin-top:12px;padding:12px 14px;background:#eff6ff;border-left:4px solid var(--acc);
    border-radius:9px;font-size:13.5px;line-height:1.65;color:#1e3a8a}
  .expl b{color:#0c4a6e}

  /* ---- Итоги ---- */
  .hero{display:flex;gap:32px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .ring-wrap{position:relative;width:170px;height:170px;flex:0 0 auto}
  .ring-wrap svg{display:block;width:100%;height:100%}
  .hero-info{flex:1;min-width:220px}
  .big-pct{
    font-size:76px;font-weight:800;line-height:1;
    letter-spacing:-3px;color:var(--txt);margin-bottom:8px;
    background:linear-gradient(135deg,var(--acc),var(--acc2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    display:inline-block;
  }
  .big-pct small{font-size:38px;font-weight:700;letter-spacing:-1px;margin-left:2px}
  .hero-info h2{font-size:20px;margin-bottom:6px}
  .hero-stats{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--mut);margin-top:10px}
  .hero-stats b{color:var(--txt);font-weight:700}

  .tstats{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .tstat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;
    box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .tstat.ok{border-color:#86efac;background:#f0fdf4}
  .tstat.warn{border-color:#fcd34d;background:#fffbeb}
  .tstat.bad{border-color:#fca5a5;background:#fef2f2}
  .tstat .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    flex-wrap:wrap;margin-bottom:8px}
  .tstat .name{font-size:13.5px;font-weight:600;color:#334155}
  .tstat .val{font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap}
  .tstat .val .pctOk{font-weight:800}
  .tbar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}
  .tbar > i{display:block;height:100%;width:0;border-radius:99px;
    transition:width 1.1s cubic-bezier(.22,1,.36,1)}
  .tbar > i.ok{background:linear-gradient(90deg,#34d399,#10b981)}
  .tbar > i.warn{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
  .tbar > i.bad{background:linear-gradient(90deg,#f87171,#ef4444)}
  .tstat.ok .pctOk{color:var(--ok)}
  .tstat.warn .pctOk{color:#b45309}
  .tstat.bad .pctOk{color:var(--bad)}

  .res{border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;
    margin-bottom:11px;background:#fff}
  .res.ok{border-left:5px solid var(--ok)}
  .res.no{border-left:5px solid var(--bad)}
  .res .n{font-size:11.5px;color:var(--mut);margin-bottom:6px;display:flex;gap:9px;
    flex-wrap:wrap;align-items:center}
  .res .q{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:8px}
  .res .line{font-size:13px;line-height:1.6;margin:3px 0}
  .tagOK{color:var(--ok);font-weight:700}
  .tagNO{color:var(--bad);font-weight:700}

  .flagitem{background:#fff7ed;border:1.5px solid #fdba74;border-radius:12px;
    padding:12px 14px;margin-bottom:9px;font-size:13px;line-height:1.6}
  .flagitem b{color:#c2410c}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);
    background:#0f172a;color:#fff;font-weight:600;font-size:13.5px;padding:12px 22px;
    border-radius:99px;transition:.3s;opacity:0;pointer-events:none;z-index:99;
    max-width:90vw;text-align:center}
  .toast.show{transform:translate(-50%,0);opacity:1}

  @media (max-width:640px){
    body{padding:12px 10px 48px;font-size:14.5px}
    .card{padding:16px 14px;border-radius:14px}
    header.top{gap:10px;margin-bottom:12px}
    .logo{width:38px;height:38px;border-radius:11px}
    .logo svg{width:24px;height:24px}
    h1{font-size:14.5px;line-height:1.3}
    h2{font-size:16px}
    .qtext{font-size:15.5px;line-height:1.5}
    .opt{padding:13px 13px;font-size:14px;min-height:50px}
    .opt .mk{width:24px;height:24px;font-size:11px}
    .btn{padding:11px 15px;font-size:13.5px;min-height:44px}
    .btn.small{padding:8px 12px;font-size:12.5px;min-height:38px}
    .topics{grid-template-columns:1fr}
    .hero{flex-direction:column;align-items:center;text-align:center;gap:14px}
    .hero-info{min-width:0;width:100%}
    .hero-stats{justify-content:center}
    .ring-wrap{width:150px;height:150px}
    .big-pct{font-size:64px;letter-spacing:-2px;margin-bottom:6px}
    .big-pct small{font-size:32px}
    .row{gap:8px}
    .qhead{gap:6px}
    .chip{font-size:11px;padding:4px 9px}
    .moment-head{font-size:14.5px}
  }
  @media (max-width:380px){
    .ring-wrap{width:130px;height:130px}
    .big-pct{font-size:56px}
    .big-pct small{font-size:28px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" title="ОТК" aria-label="Документы и контроль">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- back document -->
        <rect x="8" y="6" width="22" height="28" rx="2.5" fill="#fff" opacity=".55"/>
        <!-- front document -->
        <rect x="12" y="10" width="22" height="28" rx="2.5" fill="#fff"/>
        <path d="M16 18h14M16 23h14M16 28h9" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
        <!-- magnifier -->
        <circle cx="33" cy="33" r="8" fill="#fff" stroke="#fff" stroke-width="0"/>
        <circle cx="33" cy="33" r="6.5" stroke="#2563eb" stroke-width="2.4" fill="#fff"/>
        <path d="M38 38l5.5 5.5" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div><h1>Тестовые задания на знание нормативной документации</h1></div>
  </header>
  <main id="screen"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ТЕМЫ (по смыслам)
   ============================================================ */
const TOPICS = {
  t1:'Обязанности персонала ОТК',
  t2:'Общие правила контроля в производстве',
  t3:'Контроль по операциям ТП',
  t4:'УЗК сплошности листа',
  t5:'Зачистка деталей и швов',
  t6:'Проверка швов керосином',
  t7:'Дробемётная очистка проката',
  t8:'Сборка и сварка двутавров',
  t9:'Исправление дефектов швов',
  t10:'Общие требования по сборке',
  t11:'Маркировка',
  t12:'Дробеструйная обработка',
  t13:'Металлические сваи',
  t14:'Н-образные стержни (двутавры)'
};
const TOPIC_ICON = {
  t1:'👷', t2:'📋', t3:'⚙️', t4:'🔍', t5:'✨', t6:'🛢', t7:'🪨',
  t8:'🏗', t9:'🔧', t10:'📐', t11:'🏷', t12:'💨', t13:'⛏', t14:'📏'
};

/* ============================================================
   БАНК ВОПРОСОВ
   ============================================================ */
const BANK = [
{t:'t1',q:'Какие виды контроля качества продукции обязан контролировать или проводить мастер контрольный? (Выберите все правильные ответы)',
 o:['Входной контроль','Операционный контроль','Приемочный контроль','Летучий контроль','Инспекционный контроль','Разрушающий контроль'],c:[0,1,2],
 e:'Правильные ответы: входной контроль, операционный контроль, приемочный контроль. Это указано в ДИ-ОТК-006-2025 «Должностная инструкция мастера контрольного», п. 2.3: мастер контролирует правильность проведения входного и операционного контроля, а также сам проводит приемочный контроль металлоконструкций на соответствие конструкторской документации. Летучий, инспекционный и разрушающий контроль в обязанности мастера контрольного не входят.'},
{t:'t1',q:'Какие обязанности контролера ОТК относятся к входному контролю? (Выберите все правильные ответы)',
 o:['Осуществляет входной контроль поступившего металлопроката, материалов, деталей в соответствии с требованиями ГОСТов, действующими стандартами и инструкциями','Регистрирует результаты входного контроля качества поступившей продукции и оформляет документацию в соответствии с требованиями внутренних нормативных документов','Делает фотофиксацию контролируемых параметров','Проводит приемочный контроль металлоконструкций','Участвует в проведении контрольной сборки','Оформляет акт контрольной сборки'],c:[0,1,2],
 e:'Правильные ответы: осуществляет входной контроль поступившего металлопроката, материалов, деталей в соответствии с требованиями ГОСТов, действующими стандартами и инструкциями; регистрирует результаты входного контроля качества поступившей продукции и оформляет документацию в соответствии с требованиями внутренних нормативных документов; делает фотофиксацию контролируемых параметров. Это указано в РИ-ОТК-001-2025 «Рабочая инструкция контролера ОТК», пп. 2.1 и 2.2. Проведение приемочного контроля металлоконструкций, участие в контрольной сборке и оформление акта контрольной сборки к входному контролю не относятся.'},
{t:'t1',q:'Какие требования предъявляются к средствам измерений, применяемым контролером ОТК? (Выберите все правильные ответы)',
 o:['Только поверенные','Исправные','Любые доступные на участке','С истекшим сроком поверки','Без эксплуатационной документации'],c:[0,1],
 e:'Правильные ответы: только поверенные, исправные. Это указано в РИ-ОТК-001-2025 «Рабочая инструкция контролера ОТК», п. 2.9: «При осуществлении своей деятельности использует только поверенные и исправные средства измерений». Средства с истекшим сроком поверки, без эксплуатационной документации или любые доступные на участке применять нельзя.'},
{t:'t1',q:'Что должен уметь мастер контрольный для выполнения визуального и измерительного контроля? (Выберите все правильные ответы)',
 o:['Пользоваться измерительными инструментами и приборами','Читать конструкторскую документацию, эскизы и схемы контрольной сборки','Разрабатывать конструкторскую документацию','Выполнять поверку средств измерений','Проводить разрушающие испытания'],c:[0,1],
 e:'Правильные ответы: пользоваться измерительными инструментами и приборами; читать конструкторскую документацию, эскизы и схемы контрольной сборки. Это указано в ДИ-ОТК-006-2025, раздел 1.7 (должен уметь). Разработка конструкторской документации, поверка средств измерений и проведение разрушающих испытаний в обязанности/умения мастера контрольного не входят.'},
{t:'t1',q:'Что должен уметь контролер ОТК? (Выберите все правильные ответы)',
 o:['Пользоваться приборами и средствами измерений','Читать конструкторскую документацию, эскизы и схемы контрольной сборки','Грамотно оформлять извещения о несоответствии и другие сопроводительные документы','Разрабатывать технологические инструкции','Самостоятельно проводить контрольную сборку без участия других','Подписывать акт контрольной сборки вместо мастера'],c:[0,1,2],
 e:'Правильные ответы: пользоваться приборами и средствами измерений; читать конструкторскую документацию, эскизы и схемы контрольной сборки; грамотно оформлять извещения о несоответствии и другие сопроводительные документы. Это указано в РИ-ОТК-001-2025, п. 1.7 (должен уметь). Разработка технологических инструкций, самостоятельное проведение контрольной сборки без участия других и подписание акта контрольной сборки вместо мастера в обязанности контролера ОТК не входят.'},
{t:'t1',q:'Что обязан делать мастер контрольный при проведении контрольной сборки металлоконструкций? (Выберите все правильные ответы)',
 o:['Участвовать в проведении контрольной сборки','Оформлять акт контрольной сборки','Осуществлять фото и видеофиксацию контролируемых параметров','Оформлять извещение о несоответствии','Проводить входной контроль металлопроката','Составлять график отпусков бригады'],c:[0,1,2],
 e:'Правильные ответы: участвовать в проведении контрольной сборки; оформлять акт контрольной сборки; осуществлять фото и видеофиксацию контролируемых параметров. Это указано в ДИ-ОТК-006-2025, п. 2.13. Оформление извещения о несоответствии, проведение входного контроля металлопроката и составление графика отпусков бригады к контрольной сборке не относятся (хотя последнее входит в другие обязанности мастера).'},
{t:'t1',q:'Какие действия обязан выполнять контролер ОТК при выявлении брака? (Выберите все правильные ответы)',
 o:['Своевременно предупреждать производственного и контрольного мастера о выявлении брака','Своевременно идентифицировать несоответствующую и окончательно забракованную продукцию','Самостоятельно устранять брак','Скрывать информацию до окончания смены','Оформлять акт контрольной сборки'],c:[0,1],
 e:'Правильные ответы: своевременно предупреждать производственного и контрольного мастера о выявлении брака; своевременно идентифицировать несоответствующую и окончательно забракованную продукцию. Это указано в РИ-ОТК-001-2025, пп. 2.5 и 2.6. Самостоятельное устранение брака, сокрытие информации и оформление акта контрольной сборки в обязанности контролера при выявлении брака не входят.'},
{t:'t1',q:'Какие знания по работе с несоответствующей продукцией необходимы мастеру контрольному? (Выберите все правильные ответы)',
 o:['Порядок оформления извещений о несоответствии','Требования к работе с несоответствующей продукцией','Порядок разработки ГОСТов','Методика расчета прочности металлоконструкций','Правила ведения бухгалтерского учета'],c:[0,1],
 e:'Правильные ответы: порядок оформления извещений о несоответствии; требования к работе с несоответствующей продукцией. Это указано в ДИ-ОТК-006-2025, раздел 1.6 (должен знать). Порядок разработки ГОСТов, методика расчета прочности металлоконструкций и правила ведения бухгалтерского учета в перечень необходимых знаний мастера контрольного не входят.'},
{t:'t1',q:'Какие виды контроля и приемки упоминаются в обязанностях контролера ОТК? (Выберите все правильные ответы)',
 o:['Входной контроль','Операционный контроль','Приемка предъявленной продукции','Только визуальный контроль','Только измерительный контроль','Только приемочный контроль'],c:[0,1,2],
 e:'Правильные ответы: входной контроль; операционный контроль; приемка предъявленной продукции. Это указано в РИ-ОТК-001-2025, пп. 2.1, 2.3. Контролер осуществляет входной контроль, операционный контроль и приёмку предъявленной продукции. Ограничение только визуальным, только измерительным или только приемочным контролем не соответствует документу.'},
{t:'t1',q:'Что входит в обязанности мастера контрольного по обеспечению контроля качества и состояния средств измерений? (Выберите все правильные ответы)',
 o:['Организовывает контроль за качеством и приёмкой продукции согласно чертежам, техническим условиям, стандартам и ТД','Проверяет соблюдение контролёрами стандартов и регламентов по техническому контролю','Следит за состоянием контрольно-измерительного инструмента','Лично выполняет поверку всех средств измерений','Разрабатывает государственные стандарты','Отменяет требования конструкторской документации'],c:[0,1,2],
 e:'Правильные ответы: организовывает контроль за качеством и приёмкой продукции согласно чертежам, техническим условиям, стандартам и ТД; проверяет соблюдение контролёрами стандартов и регламентов по техническому контролю; следит за состоянием контрольно-измерительного инструмента. Это указано в ДИ-ОТК-006-2025, пп. 2.2, 2.5. Личное выполнение поверки всех средств измерений, разработка государственных стандартов и отмена требований конструкторской документации в обязанности мастера не входят.'},
{t:'t2',q:'В какой последовательности согласно документу выполняются ВИК и неразрушающий контроль сварных соединений?',
 o:['Неразрушающий контроль проводится после исправления дефектов, выявленных визуальным и измерительным контролем','Неразрушающий контроль проводится до ВИК','ВИК проводится после ультразвукового контроля','ВИК и УЗК проводятся одновременно без учёта результатов друг друга'],c:[0],
 e:'Правильный ответ: Неразрушающий контроль проводится после исправления дефектов, выявленных визуальным и измерительным контролем. Согласно общей логике контроля качества в СТО СМК 8.6-04-2021 (раздел 6.5) и стандартной последовательности: сначала ВИК, устранение выявленных дефектов, затем неразрушающий контроль. Проведение НРК до ВИК или одновременно без учёта результатов не соответствует установленному порядку.'},
{t:'t2',q:'Когда согласно документу проводится операционный контроль качества сварных соединений?',
 o:['До нанесения антикоррозионной защиты (в том числе окрашивания конструкций)','После нанесения антикоррозионной защиты','Только после окрашивания','После упаковки и отгрузки'],c:[0],
 e:'Правильный ответ: До нанесения антикоррозионной защиты (в том числе окрашивания конструкций). Согласно СТО СМК 8.6-04-2021, раздел 6.5.5 (операционный контроль): контроль качества сварных соединений выполняется в процессе изготовления, до нанесения антикоррозионных покрытий. После окрашивания доступ к швам для контроля ограничен.'},
{t:'t3',q:'Выберите все параметры контроля на заготовительных операциях, относящиеся к ВИК',
 o:['Длина, ширина, равенство диагоналей, толщина, диаметр отверстий, овальность','Качество обработки поверхности: чистота реза, отсутствие заусенец, грата, выхватов, неровностей, трещин по краям отверстий и завалов','Плоскостность (отсутствие искривления, винтообразности)','Адгезия лакокрасочного покрытия','Количество и качество прихваток','Температура и влажность воздуха'],c:[0,1,2],
 e:'Правильные ответы: Длина, ширина, равенство диагоналей, толщина, диаметр отверстий, овальность; Качество обработки поверхности: чистота реза, отсутствие заусенец, грата, выхватов, неровностей, трещин по краям отверстий и завалов; Плоскостность (отсутствие искривления, винтообразности). Эти параметры относятся к визуально-измерительному контролю на заготовительных операциях (СТО СМК 8.6-04-2021, 6.5.5 — геометрические параметры деталей и заготовок). Адгезия ЛКМ, прихватки и климатические параметры к ВИК на заготовке не относятся.'},
{t:'t3',q:'Выберите все действия контролёра ОТК при оформлении несоответствующих деталей на заготовительных операциях',
 o:['Оформить «Извещение о несоответствии» (Приложение Б)','Зарегистрировать информацию в «Журнале регистрации извещений о несоответствиях» (Приложение В)','Передать «Извещение о несоответствии» производственному мастеру','Оформить «Акт о браке» (Приложение Е)','Идентифицировать продукцию зелёной биркой','Направить извещение непосредственно заказчику'],c:[0,1,2],
 e:'Правильные ответы: Оформить «Извещение о несоответствии» (Приложение Б); Зарегистрировать информацию в «Журнале регистрации извещений о несоответствиях» (Приложение В); Передать «Извещение о несоответствии» производственному мастеру. Эти действия соответствуют порядку работы с несоответствующей продукцией (ДИ-ОТК-006-2025, РИ-ОТК-001-2025 и СТО СМК 8.6-04-2021). Оформление «Акта о браке», зелёная бирка и направление извещения заказчику на этом этапе не применяются.'},
{t:'t2',q:'Какой биркой контролёр ОТК идентифицирует несоответствующие детали?',
 o:['Жёлтой биркой «Несоответствующая продукция»','Красной биркой «Брак»','Зелёной биркой «Годная продукция»','Синей биркой «На проверку»'],c:[0],
 e:'Правильный ответ: Жёлтой биркой «Несоответствующая продукция». Согласно принятой на предприятии системе идентификации (РИ-ОТК-001-2025, п. 2.5 и связанные НД) несоответствующая продукция идентифицируется жёлтой биркой.'},
{t:'t3',q:'Какой объём контроля установлен на операции «Сборка»?',
 o:['1','10% от партии, но не менее 3-х деталей','5% от партии','Выборочно по решению контролёра'],c:[0],
 e:'Правильный ответ: 100% (1). На операции «Сборка» установлен полный (100%) контроль. Выборочный контроль 10% или 5% для сборки не применяется — сборка является критической операцией, требующей сплошного контроля.'},
{t:'t3',q:'Выберите все параметры контроля на операции «Сварка»',
 o:['Маркировка на бирке','Геометрия и качество сварных соединений','Адгезия лакокрасочного покрытия','Температура и влажность воздуха','Подготовка поверхности к окрашиванию'],c:[0,1],
 e:'Правильные ответы: Маркировка на бирке; Геометрия и качество сварных соединений. На операции «Сварка» контролируются маркировка и параметры сварных соединений. Адгезия ЛКМ, климатические параметры и подготовка поверхности к окрашиванию относятся к другим операциям.'},
{t:'t3',q:'Где установлены допуски на дефекты (поры, непровары, подрезы и др.) при контроле на операции «Зачистка»?',
 o:['В ГОСТ 23118-2019','В ГОСТ 9.402-2004','В ГОСТ 15140-78','В СТО СМК 8.5.2-01-2020'],c:[0],
 e:'Правильный ответ: В ГОСТ 23118-2019. Допуски на дефекты сварных швов (поры, непровары, подрезы и др.) установлены в ГОСТ 23118-2019 «Конструкции стальные строительные. Общие технические условия». ГОСТ 9.402 и ГОСТ 15140 относятся к подготовке поверхности и адгезии, СТО СМК 8.5.2 — к маркировке проката.'},
{t:'t3',q:'Где дефектоскопист ЛНК регистрирует результаты визуального и измерительного контроля?',
 o:['В программе 1С:ERP, блок ОТК/регистрация ВИК и УЗК сварных швов (Приложение А-2)','В «Журнале нанесения покрытия» (Приложение А-3)','В «Акте о браке» (Приложение Е)','В «Сменной выработке работника»'],c:[0],
 e:'Правильный ответ: В программе 1С:ERP, блок ОТК/регистрация ВИК и УЗК сварных швов (Приложение А-2). Результаты ВИК и УЗК регистрируются дефектоскопистом ЛНК в указанной программе. Журнал нанесения покрытия, акт о браке и сменная выработка для этой цели не используются.'},
{t:'t3',q:'Выберите все документы, которые оформляет дефектоскопист ЛНК при положительных результатах ВИК и УЗК на операции «Зачистка»',
 o:['«Акт визуального и (или) измерительного контроля» (Приложение Ж)','«Заключение по ультразвуковому контролю сварных соединений» (Приложение З)','«Заключение по ультразвуковому контролю сплошности (расслоения) основного металла» (Приложение И) — при необходимости','«Акт о браке» (Приложение Е)','«Извещение о несоответствии» (Приложение Б)','«План корректирующих действий» (Приложение Д)'],c:[0,1,2],
 e:'Правильные ответы: «Акт визуального и (или) измерительного контроля» (Приложение Ж); «Заключение по ультразвуковому контролю сварных соединений» (Приложение З); «Заключение по ультразвуковому контролю сплошности (расслоения) основного металла» (Приложение И) — при необходимости. Акт о браке, извещение о несоответствии и план корректирующих действий оформляются при отрицательных результатах.'},
{t:'t3',q:'Какой объём контроля установлен для адгезии покрытия ЛКМ на операции «Подготовка поверхности и нанесение ЛКМ»?',
 o:['Выборочный контроль в объёме 10% от партии (сменной выработки), но не менее 3-х деталей','100% визуально','100% при помощи толщиномера','5% от партии, но не менее 5 деталей'],c:[0],
 e:'Правильный ответ: Выборочный контроль в объёме 10% от партии (сменной выработки), но не менее 3-х деталей. Объём контроля адгезии соответствует принятому на предприятии выборочному контролю для данной операции.'},
{t:'t3',q:'Выберите все параметры контроля на операции «Подготовка поверхности и нанесение ЛКМ»',
 o:['Температура и влажность воздуха','Толщина покрытия','Адгезия покрытия ЛКМ','Равенство диагоналей деталей','Количество и качество прихваток','Класс прочности болтов и гаек'],c:[0,1,2],
 e:'Правильные ответы: Температура и влажность воздуха; Толщина покрытия; Адгезия покрытия ЛКМ. Эти параметры контролируются на операции подготовки поверхности и нанесения ЛКМ. Геометрия деталей, прихватки и класс прочности метизов к данной операции не относятся.'},
{t:'t3',q:'Выберите все документы, которые оформляет контролёр ОТК/контрольный мастер ОТК при положительных результатах качества на операции «Подготовка поверхности и нанесение ЛКМ»',
 o:['«Акт скрытых работ (очистки поверхности металлоконструкций)» (Приложение Л)','«Акт приёмки антикоррозийного покрытия металлических конструкций» (Приложение М)','Подпись в «Накладной на передачу готовой продукции»','«Акт о браке» (Приложение Е)','«Извещение о несоответствии» (Приложение Б)','«Заключение по ультразвуковому контролю сварных соединений» (Приложение З)'],c:[0,1,2],
 e:'Правильные ответы: «Акт скрытых работ (очистки поверхности металлоконструкций)» (Приложение Л); «Акт приёмки антикоррозийного покрытия металлических конструкций» (Приложение М); Подпись в «Накладной на передачу готовой продукции» (или аналогичном документе передачи). Эти документы оформляются при положительных результатах контроля покрытия.'},
{t:'t2',q:'С какой целью при входном контроле проводится визуально-измерительный контроль материалов и изделий?',
 o:['Выявление возможных поверхностных дефектов и повреждений','Проверка соответствия геометрических размеров требованиям НД','Проверка адгезии лакокрасочного покрытия','Проверка квалификации сварщика','Проверка температуры и влажности в цехе'],c:[0,1],
 e:'Правильные ответы: Выявление возможных поверхностных дефектов и повреждений; Проверка соответствия геометрических размеров требованиям НД. Согласно СТО СМК 8.6-04-2021, п. 6.2 (входной контроль): визуально-измерительный контроль материалов и изделий проводится с целью выявления поверхностных дефектов и проверки геометрических размеров. Адгезия, квалификация сварщика и климатические параметры к входному контролю материалов не относятся.'},
{t:'t2',q:'Выберите все параметры приёмочного контроля качества изготовленной продукции, относящиеся к ВИК',
 o:['Визуальный контроль конструкций','Выборочный контроль антикоррозионной защиты, сварных швов и других требований','Геометрические параметры конструкций, влияющие на собираемость конструкций','Контроль удвоенного количества деталей','Оформление извещения о несоответствии','Входной контроль материалов'],c:[0,1,2],
 e:'Правильные ответы: Визуальный контроль конструкций; Выборочный контроль антикоррозионной защиты, сварных швов и других требований; Геометрические параметры конструкций, влияющие на собираемость конструкций. Согласно СТО СМК 8.6-04-2021, п. 6.5.6 (приемочный контроль). Контроль удвоенного количества, оформление извещения и входной контроль — это другие процедуры.'},
{t:'t2',q:'Выберите все параметры контроля состояния средств измерений (СИ), используемых при ВИК',

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function prepare(q){
  const opts = q.o.map((t,i)=>({t, ok:q.c.includes(i)}));
  shuffle(opts);
  return {t:q.t, q:q.q, e:q.e, o:opts.map(x=>x.t), c:opts.map((x,i)=>x.ok?i:-1).filter(i=>i>=0)};
}

function pickQuestions(selectedTopics, total){
  const byTopic = {};
  selectedTopics.forEach(t => { byTopic[t] = BANK.filter(q => q.t === t); });
  const available = Object.values(byTopic).reduce((s,a)=>s+a.length,0);
  total = Math.min(total, available);

  const N = selectedTopics.length;
  const base = Math.floor(total / N);
  const rem = total - base*N;
  const order = shuffle([...selectedTopics]);
  const counts = {};
  selectedTopics.forEach(t => counts[t] = base);
  for(let i=0;i<rem;i++) counts[order[i]]++;

  let changed = true;
  while(changed){
    changed = false;
    for(const t of selectedTopics){
      if(counts[t] > byTopic[t].length){
        const ex = counts[t] - byTopic[t].length;
        counts[t] = byTopic[t].length;
        for(const t2 of selectedTopics){
          if(t2!==t && counts[t2] < byTopic[t2].length){
            counts[t2] += ex; changed = true; break;
          }
        }
      }
    }
  }

  const picked = [];
  selectedTopics.forEach(t => {
    const pool = shuffle([...byTopic[t]]);
    picked.push(...pool.slice(0, counts[t]).map(prepare));
  });
  if(picked.length < total){
    const used = new Set(picked.map(p=>p.q));
    const rest = shuffle(BANK.filter(q => selectedTopics.includes(q.t) && !used.has(q.q)));
    while(picked.length < total && rest.length) picked.push(prepare(rest.pop()));
  }
  return shuffle(picked);
}

      else cur = [k];
      S.answers[i] = cur;
      [...$('opts').children].forEach((c,idx)=>c.classList.toggle('sel', cur.includes(idx)));
    });

    $('revealBtn').onclick = ()=>{
      saveComment(i);
      if(!(S.answers[i] && S.answers[i].length)){
        if(!confirm('Ответ не выбран. Продолжить без ответа?')) return;
        S.answers[i] = [];
      }
      S.revealed[i] = true;
      renderQuestion();
    };
  } else {
    $('nextBtn').onclick = ()=>{
      saveComment(i);
      if(S.idx === S.qs.length-1) finish();
      else { S.idx++; renderQuestion(); }
    };
  }

  $('flagBtn').onclick = ()=>{
    const fb = $('flagbox');
    fb.classList.toggle('open');
    if(fb.classList.contains('open')) $('flagtext').focus();
  };
  $('saveFlag').onclick = ()=>{ saveComment(i, true); renderQuestion(); toast('Комментарий сохранён'); };
  $('closeFlag').onclick = ()=>{ saveComment(i); $('flagbox').classList.remove('open'); };
  $('prev').onclick = ()=>{ saveComment(i); S.idx--; renderQuestion(); };
}

function saveComment(i, force){
  const el = $('flagtext');
  if(!el) return;
  const txt = el.value.trim();
  if(txt){ S.flags[i] = {open:false, text:txt}; }
  else if(force){ delete S.flags[i]; }
}

/* ============================================================
   ЭКРАН 3 — РЕЗУЛЬТАТЫ
   ============================================================ */
function finish(){
  S.finished = Date.now();

  let correctTotal = 0;
  const perTopic = {};
  S.qs.forEach((q,i)=>{
    const a = S.answers[i]||[];
    const okq = a.length && [...a].sort().join(',') === [...q.c].sort().join(',');
    if(okq) correctTotal++;
    if(!perTopic[q.t]) perTopic[q.t] = {total:0, ok:0};
    perTopic[q.t].total++;
    if(okq) perTopic[q.t].ok++;
  });

  const total = S.qs.length;
  const pct = Math.round(correctTotal/total*100);
  const secs = Math.round((S.finished - S.started)/1000);
  const mm = String(Math.floor(secs/60)).padStart(2,'0');
  const ss = String(secs%60).padStart(2,'0');
  S.result = {correctTotal, total, pct, secs, perTopic};

  const CIRC = 2 * Math.PI * 62;
  // цвет кольца: зелёный ≥80, жёлтый 50–79, красный <50
  const ringColor = pct >= 80 ? '#10b981' : (pct >= 50 ? '#f59e0b' : '#ef4444');
  const ringColor2 = pct >= 80 ? '#059669' : (pct >= 50 ? '#d97706' : '#dc2626');
  const weakTopics = Object.keys(perTopic).filter(t => Math.round(perTopic[t].ok/perTopic[t].total*100) < 70);

  const tstats = Object.keys(perTopic).map(t=>{
    const d = perTopic[t];
    const okPct = Math.round(d.ok / d.total * 100);
    let cls = 'ok';
    if(okPct < 50) cls = 'bad';
    else if(okPct < 80) cls = 'warn';
    return `
      <div class="tstat ${cls}">
        <div class="top">
          <span class="name">${TOPIC_ICON[t]||''} ${TOPICS[t]}</span>
          <span class="val"><span class="pctOk">${okPct}%</span> верных · ${d.ok}/${d.total}</span>
        </div>
        <div class="tbar"><i class="${cls}" data-w="${okPct}"></i></div>
      </div>`;
  }).join('');

  const flagged = Object.keys(S.flags).filter(k => S.flags[k] && S.flags[k].text);

  screen().innerHTML = `
  <div class="card">
    <div class="hero">
      <div class="ring-wrap">
        <svg viewBox="0 0 150 150">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="${ringColor}"/>
              <stop offset="100%" stop-color="${ringColor2}"/>
            </linearGradient>
          </defs>
          <circle cx="75" cy="75" r="62" stroke="#e2e8f0" stroke-width="14" fill="none"/>
          <circle id="ringProg" cx="75" cy="75" r="62" stroke="url(#grad)" stroke-width="14" fill="none"
            stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"
            stroke-linecap="round" transform="rotate(-90 75 75)"/>
        </svg>
      </div>
      <div class="hero-info">
        <div class="big-pct"><span id="pctNum">0</span><small>%</small></div>
        <h2>Результат тестирования</h2>
        <div class="muted" style="font-size:13.5px">${esc(S.fio)}</div>
        <div class="hero-stats">
          <span>Правильно: <b>${correctTotal}</b> из <b>${total}</b></span>
          <span>Время: <b>${mm}:${ss}</b></span>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="mail">✉️ Отправить результаты почтой</button>
      <button class="btn ghost" id="again">🔄 Пройти заново</button>
      ${weakTopics.length ? `<button class="btn warn" id="retryWeak">📚 Повторить слабые темы (${weakTopics.length})</button>` : ''}
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" id="copyRes">📋 Скопировать результаты</button>
    </div>
    <p class="muted" style="margin-top:12px;font-size:13px;line-height:1.55">
      Основной способ — <b>отправить результаты почтой</b> (откроется почтовый клиент с полным протоколом).
      Если почта недоступна, нажмите «Скопировать результаты» и отправьте текст любым удобным способом,
      например в мессенджер <b>MAX</b>.
    </p>
  </div>

  <div class="card">
    <h2>Верные ответы по темам</h2>
    <p class="muted" style="margin-bottom:10px">Чем выше процент, тем лучше усвоена тема. Красные и жёлтые полосы — темы, которые стоит подтянуть.</p>
    <div class="tstats">${tstats}</div>
  </div>

  <div class="card">
    <h2>Разбор ответов</h2>
    ${S.qs.map((q,i)=>{
      const a = S.answers[i]||[];
      const okq = a.length && [...a].sort().join(',') === [...q.c].sort().join(',');
      return `<div class="res ${okq?'ok':'no'}">
        <div class="n">
          <span>Вопрос ${i+1}</span>
          <span class="chip t">${TOPICS[q.t]}</span>
          <span class="${okq?'tagOK':'tagNO'}">${okq?'✓ верно':'✗ неверно'}</span>
          ${S.flags[i] && S.flags[i].text ? '<span style="color:#c2410c">💬 комментарий</span>' : ''}
        </div>
        <div class="q">${esc(q.q)}</div>
        <div class="line">Ваш ответ: <b>${a.length ? a.map(k=>LETTERS[k]+') '+esc(q.o[k])).join('; ') : '— не отвечено —'}</b></div>
        <div class="line">Верный ответ: <b class="tagOK">${q.c.map(k=>LETTERS[k]+') '+esc(q.o[k])).join('; ')}</b></div>
        <div class="expl">${esc(q.e)}</div>
      </div>`;
    }).join('')}
  </div>

  ${flagged.length ? `
  <div class="card">
    <h2>Комментарии к вопросам</h2>
    ${flagged.map(k=>{
      const i = +k;
      return `<div class="flagitem">
        <b>Вопрос ${i+1}.</b> ${esc(S.qs[i].q)}<br>
        <span class="muted" style="font-size:12.5px">Тема: ${TOPICS[S.qs[i].t]}</span><br>
        <b>Комментарий:</b> ${esc(S.flags[i].text)}
      </div>`;
    }).join('')}
  </div>`:''}`;

  animateRing(pct, CIRC);
  animateNumber('pctNum', pct);
  requestAnimationFrame(()=>{
    document.querySelectorAll('.tbar > i').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
  });

  $('again').onclick = ()=>{ S = null; renderStart(); };
  const rw = $('retryWeak');
  if(rw){
    rw.onclick = ()=>{
      const fio = S.fio;
      const qs = pickQuestions(weakTopics, TOTAL_Q);
      if(!qs.length){ toast('Нет вопросов по слабым темам'); return; }
      S = { fio, topics: weakTopics, qs, idx:0, answers:{}, revealed:{}, flags:{}, started: Date.now() };
      renderQuestion();
      toast('Повтор слабых тем: ' + weakTopics.map(t=>TOPICS[t]).join(', '));
    };
  }
  const subj = `Тест — ${pct}% — ${S.fio}`;
  const fullReport = buildReport();

  $('copyRes').onclick = async ()=>{
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(fullReport);
      } else {
        const ta = document.createElement('textarea');
        ta.value = fullReport;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      toast('Результаты скопированы — можно вставить в MAX или письмо');
    } catch(err){
      toast('Не удалось скопировать. Выделите текст протокола вручную.');
      console.error(err);
    }
  };

  $('mail').onclick = ()=>{
    // Полный развёрнутый протокол в теле письма
    const body = fullReport;
    const href = 'mailto:' + EMAIL
      + '?subject=' + encodeURIComponent(subj)
      + '&body=' + encodeURIComponent(body);

    // Пробуем открыть почтовый клиент
    const a = document.createElement('a');
    a.href = href;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    // На всякий случай дублируем через location (часть клиентов так надёжнее)
    setTimeout(()=>{
      try { window.location.href = href; } catch(e) {}
    }, 50);

    toast('Открывается почта с полным протоколом. Если не открылась — нажмите «Скопировать результаты»');
  };
}

function animateRing(pct, CIRC){
  const el = $('ringProg'); if(!el) return;
  const target = CIRC * (1 - pct/100);
  const dur = 1400, start = performance.now();
  const step = now => {
    const t = Math.min(1, (now-start)/dur);
    const e = 1 - Math.pow(1-t, 3);
    const val = CIRC + (target - CIRC) * e;
    el.setAttribute('stroke-dashoffset', val.toFixed(1));
    if(t<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function animateNumber(id, to){
  const el = $(id); if(!el) return;
  const dur = 1400, start = performance.now();
  const step = now => {
    const t = Math.min(1, (now-start)/dur);
    const e = 1 - Math.pow(1-t, 3);
    el.textContent = Math.round(to * e);
    if(t<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ============================================================
   ПИСЬМО (текст для mailto — не отображается на странице)
   ============================================================ */
function buildReport(){
  const r = S.result, d = new Date();
  const dt = d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const mm = String(Math.floor(r.secs/60)).padStart(2,'0');
  const ss = String(r.secs%60).padStart(2,'0');

  let L = [];
  L.push('ТЕМА: Результаты тестирования — ' + r.pct + '%');
  L.push('');
  L.push('Здравствуйте!');
  L.push('');
  L.push('Направляю результаты прохождения тестирования.');
  L.push('');
  L.push('--- ПРОТОКОЛ ---');
  L.push('ФИО: ' + S.fio);
  L.push('Дата и время: ' + dt);
  L.push('Затраченное время: ' + mm + ':' + ss);
  L.push('Всего вопросов: ' + r.total);
  L.push('Правильных ответов: ' + r.correctTotal);
  L.push('Ошибок: ' + (r.total - r.correctTotal));
  L.push('Итог: ' + r.pct + '%');
  L.push('');
  L.push('Темы: ' + S.topics.map(t=>TOPICS[t]).join('; '));
  L.push('');

  L.push('--- ВЕРНЫЕ ОТВЕТЫ ПО ТЕМАМ ---');
  Object.keys(r.perTopic).forEach(t=>{
    const d = r.perTopic[t];
    const okPct = Math.round(d.ok / d.total * 100);
    L.push(`  • ${TOPICS[t]}: ${okPct}% верных (${d.ok} из ${d.total})`);
  });
  L.push('');

  const flagged = Object.keys(S.flags).filter(k => S.flags[k] && S.flags[k].text);
  L.push('--- КОММЕНТАРИИ К ВОПРОСАМ (' + flagged.length + ') ---');
  if(!flagged.length){ L.push('  нет'); }
  else {
    flagged.forEach(k=>{
      const i = +k;
      L.push('');
      L.push(`  Вопрос ${i+1}. ${S.qs[i].q}`);
      L.push(`    Тема: ${TOPICS[S.qs[i].t]}`);
      L.push(`    Комментарий: ${S.flags[i].text}`);
    });
  }
  L.push('');

  L.push('--- ДЕТАЛИЗАЦИЯ ОТВЕТОВ ---');
  S.qs.forEach((q,i)=>{
    const a = S.answers[i]||[];
    const okq = a.length && [...a].sort().join(',') === [...q.c].sort().join(',');
    L.push('');
    L.push(`Вопрос ${i+1} [${okq?'ВЕРНО':'НЕВЕРНО'}] (${TOPICS[q.t]})`);
    L.push('  ' + q.q);
    L.push('  Ответ: ' + (a.length ? a.map(k=>LETTERS[k]+') '+q.o[k]).join(' | ') : 'нет ответа'));
    L.push('  Верно: ' + q.c.map(k=>LETTERS[k]+') '+q.o[k]).join(' | '));
    L.push('  Разъяснение: ' + q.e);
  });

  L.push('');
  L.push('--- КОНЕЦ ПРОТОКОЛА ---');
  return L.join('\n');
}

/* СТАРТ */
renderStart();
</script>
